services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: coverfetch
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    tmpfs: /var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s